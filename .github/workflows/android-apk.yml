name: APK FK Kaka
on:
  push:
    branches: [codex/fk-kaka-android]
    paths: ['android/**', '.github/workflows/android-apk.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compilar e verificar
        working-directory: android
        run: gradle --no-daemon assembleDebug lintDebug
      - name: Preparar download
        run: cp android/app/build/outputs/apk/debug/app-debug.apk FK-Kaka-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FK-Kaka-Android
          path: FK-Kaka-Android.apk
          retention-days: 90
