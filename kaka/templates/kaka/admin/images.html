{% extends 'kaka/admin/base.html' %}{% block content %}<form class="panel" method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{brand_csrf()}}"><h2>Enviar imagem</h2><label>PNG, JPEG ou WebP, até 8 MB<input type="file" name="image" accept="image/png,image/jpeg,image/webp" required></label><button>Enviar para biblioteca</button></form><div class="grid">{% for image in images %}<article class="panel"><img src="{{image}}" alt="Imagem da biblioteca" style="width:100%;height:180px;object-fit:cover"><label>Copie o endereço para usar no editor<input readonly value="{{image}}" onclick="this.select()"></label></article>{% else %}<p>Nenhuma imagem enviada ainda.</p>{% endfor %}</div>{% endblock %}
