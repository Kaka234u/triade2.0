{% extends 'portal_clients/base.html' %}{% block content %}<p>Alterações afetam novas estimativas. Contratos existentes mantêm o preço combinado até serem atualizados na página de contratos.</p>{% for p in rows %}<form method="post" class="panel"><input type="hidden" name="csrf_token" value="{{brand_csrf()}}"><input type="hidden" name="slug" value="{{p.slug}}"><div class="field-grid"><label>Nome<input name="name" required value="{{p.name}}"></label><label>Preço-base (R$)<input name="price" required type="number" min="0" max="1000000" step="0.01" value="{{p.price/100}}"></label><label>Modalidade<select name="period">{% for period in ['mensal','avulso','consulta'] %}<option {{'selected' if p.period==period}}>{{period}}</option>{% endfor %}</select></label></div><label>Descrição<textarea name="description" required>{{p.description}}</textarea></label><button>Salvar plano</button></form>{% endfor %}{% endblock %}
