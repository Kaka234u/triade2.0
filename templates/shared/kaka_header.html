<header class="brand-header">
  <a class="brand-home" href="{{url_for('kaka.home')}}" aria-label="FK Káka Autodetail — início">
    <img src="{{url_for('kaka.static',filename='images/fk-kaka-logo.png')}}" alt="FK Káka Autodetail" width="158" height="52">
  </a>
  <nav aria-label="Navegação principal">
    <a href="{{url_for('kaka.home')}}">Início</a>
    <a href="{{url_for('kaka.services_page')}}">Serviços</a>
    <a href="{{url_for('kaka.contact')}}">Contato</a>
